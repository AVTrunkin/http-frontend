name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory:helpdesk/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: http/helpdesk/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: http/helpdesk/frontend

      - name: Lint
        run: npm run lint
        working-directory: http/helpdesk/frontend

      - name: Build
        run: npm run build
        working-directory: http/helpdesk/frontend

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./http/helpdesk/frontend/dist
